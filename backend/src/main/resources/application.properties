# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=UrbanBite-Backend

# Database Configuration (PostgreSQL when DB_URL/SPRING_DATASOURCE_URL is provided, fallback to H2)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:h2:mem:urbanbite_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# H2 Web Console (accessible at /h2-console for dev inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
urbanbite.jwt.secret=${JWT_SECRET:UrbanBiteSuperSecretSecureKeyForJwtTokenGeneration2026!UrbanBiteLuxuryDiningFoodPlatform}
urbanbite.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Spring Mail (SMTP configuration with graceful mock fallback)
spring.mail.host=${SPRING_MAIL_HOST:${SMTP_HOST:localhost}}
spring.mail.port=${SPRING_MAIL_PORT:${SMTP_PORT:1025}}
spring.mail.username=${SPRING_MAIL_USERNAME:${SMTP_USERNAME:${EMAIL_USER:noreply@urbanbite.com}}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${SMTP_PASSWORD:${EMAIL_PASS:}}}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator & Management
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.com.urbanbite=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.orm.jdbc.warn=ERROR
